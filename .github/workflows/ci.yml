name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x86_64
            host: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: linux-aarch64
            host: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: macos-x86_64
            host: x86_64-apple-darwin
          - runner: macos-15
            target: macos-aarch64
            host: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HOST: ${{ matrix.host }}
      NATIVE_TARGET: ${{ matrix.target }}
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated runner paths before toolchain setup
        run: |
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/tmp"
          for variable in CARGO_HOME RUSTUP_HOME CARGO_TARGET_DIR PIP_CACHE_DIR XDG_CACHE_HOME; do
            echo "$variable=$RUNNER_TEMP/$variable" >> "$GITHUB_ENV"
          done
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record and verify the native host
        run: |
          rustc -vV | tee "$RUNNER_TEMP/evidence/rustc.txt"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cargo -V > "$RUNNER_TEMP/evidence/cargo.txt"
          uname -a > "$RUNNER_TEMP/evidence/machine.txt"
      - name: Verify measurement recorder contracts
        run: python -B -m unittest discover -s .github/benchmarks -p test_measure.py 2>&1 | tee "$RUNNER_TEMP/evidence/recorder-tests.log"
      - name: Install and record the pinned compatibility oracle
        run: |
          python -m pip install --report "$RUNNER_TEMP/evidence/pip-install.json" sourmash==4.9.4 2>&1 | tee "$RUNNER_TEMP/evidence/pip-install.log"
          sourmash --version | tee "$RUNNER_TEMP/evidence/sourmash-version.txt"
          test "$(sourmash --version)" = 'sourmash 4.9.4'
          python -m pip freeze > "$RUNNER_TEMP/evidence/pip-freeze.txt"
      - name: Check formatting, strict lint and documentation
        run: |
          cargo fmt --all -- --check 2>&1 | tee "$RUNNER_TEMP/evidence/fmt.log"
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/evidence/clippy.log"
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps 2>&1 | tee "$RUNNER_TEMP/evidence/rustdoc.log"
          cargo bench --locked --bench sketch -- --test 2>&1 | tee "$RUNNER_TEMP/evidence/bench-smoke.log"
      - name: Create and verify the exact Git-preserving source archive
        run: python -B scripts/delivery.py source 2>&1 | tee "$RUNNER_TEMP/evidence/source.log"
      - name: Test and install the extracted locked source
        run: |
          cd "$SOURCE_DIRECTORY"
          test "$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')" = "$CARGO_TARGET_DIR"
          cargo test --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/evidence/source-debug-tests.log"
          cargo test --release --locked --all-targets --all-features 2>&1 | tee "$RUNNER_TEMP/evidence/source-release-tests.log"
          cargo install --path . --locked --root "$RUNNER_TEMP/installed" 2>&1 | tee "$RUNNER_TEMP/evidence/source-install.log"
      - name: Run all four live oracle tests in debug and release against the installed binary
        env:
          SOURMASH: sourmash
          RSOMICS_SKETCH_BIN: ${{ runner.temp }}/installed/bin/rsomics-sketch
        run: |
          cd "$SOURCE_DIRECTORY"
          cargo test --locked --test oracle -- --ignored 2>&1 | tee "$RUNNER_TEMP/evidence/installed-debug-oracle.log"
          cargo test --release --locked --test oracle -- --ignored 2>&1 | tee "$RUNNER_TEMP/evidence/installed-release-oracle.log"
      - name: Exercise the connected installed four-command lifecycle
        run: python -B scripts/delivery.py smoke --binary "$RUNNER_TEMP/installed/bin/rsomics-sketch" 2>&1 | tee "$RUNNER_TEMP/evidence/installed-lifecycle.log"
      - name: Bundle the exercised native binary, exact source and original terms
        run: python -B scripts/delivery.py bundle --binary "$RUNNER_TEMP/installed/bin/rsomics-sketch" 2>&1 | tee "$RUNNER_TEMP/evidence/bundle.log"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: sketch-native-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/delivery
            ${{ runner.temp }}/source-verification.json
          if-no-files-found: error
          retention-days: 90
