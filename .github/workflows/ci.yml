name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps
      - run: cargo bench --locked --bench sketch -- --test
      - run: cargo package --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install sourmash==4.9.4
      - run: test "$(sourmash --version)" = "sourmash 4.9.4"
      - run: cargo test --locked --all-targets --all-features
      - run: SOURMASH=sourmash cargo test --locked --test oracle -- --ignored --skip short_sequences_match_sourmash
      - name: Reproduce short-sequence dependency failure
        shell: bash
        run: |
          set +e
          SOURMASH=sourmash cargo test --locked --test oracle short_sequences_match_sourmash -- --ignored > "$RUNNER_TEMP/sketch-short.log" 2>&1
          test_rc=$?
          set -e
          cat "$RUNNER_TEMP/sketch-short.log"
          test "$test_rc" -eq 101
          grep -F 'short_sequences_match_sourmash ... FAILED' "$RUNNER_TEMP/sketch-short.log"
          grep -F 'range end index' "$RUNNER_TEMP/sketch-short.log"
