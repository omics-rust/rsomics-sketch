name: Sketch construction measurements

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.native.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        native:
          - runner: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            host: x86_64-apple-darwin
          - runner: macos-15
            host: aarch64-apple-darwin
        workload: [genome, fastq-abundance]
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_HOST: ${{ matrix.native.host }}
      WORKLOAD: ${{ matrix.workload }}
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v6
      - name: Prepare isolated paths before toolchain setup
        run: |
          mkdir -p "$RUNNER_TEMP/evidence/builds/candidate" "$RUNNER_TEMP/inputs" "$RUNNER_TEMP/tmp"
          for variable in CARGO_HOME RUSTUP_HOME CARGO_TARGET_DIR PIP_CACHE_DIR XDG_CACHE_HOME; do
            echo "$variable=$RUNNER_TEMP/$variable" >> "$GITHUB_ENV"
          done
          echo "TMPDIR=$RUNNER_TEMP/tmp" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record actual source and native host
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc -vV | tee "$RUNNER_TEMP/evidence/rustc.txt"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$EXPECTED_HOST"
          {
            date -u
            uname -a
            if [[ "$RUNNER_OS" == Linux ]]; then lscpu; else sysctl -n machdep.cpu.brand_string; fi
            cargo -V
            git rev-parse HEAD HEAD^{tree}
            shasum -a 256 Cargo.toml Cargo.lock .github/benchmarks/measure.py
          } > "$RUNNER_TEMP/evidence/provenance.txt"
          cp .github/benchmarks/measure.py .github/workflows/benchmark.yml "$RUNNER_TEMP/evidence/"
      - name: Verify recorder contracts
        run: python -B -m unittest discover -s .github/benchmarks -p test_measure.py 2>&1 | tee "$RUNNER_TEMP/evidence/recorder-tests.log"
      - name: Install and record the pinned oracle
        run: |
          set -euo pipefail
          python -m pip install --report "$RUNNER_TEMP/evidence/pip-install.json" sourmash==4.9.4 2>&1 | tee "$RUNNER_TEMP/evidence/pip-install.log"
          python -m pip freeze > "$RUNNER_TEMP/evidence/pip-freeze.txt"
          SOURMASH="$(command -v sourmash)"
          if [[ "$EXPECTED_HOST" == aarch64-unknown-linux-gnu ]]; then
            SOURMASH="$GITHUB_WORKSPACE/scripts/ci-sourmash"
            test -x "$SOURMASH"
            "$SOURMASH" --record-runtime "$RUNNER_TEMP/evidence/sourmash-runtime-before.json"
          fi
          echo "SOURMASH=$SOURMASH" >> "$GITHUB_ENV"
          "$SOURMASH" --version | tee "$RUNNER_TEMP/evidence/sourmash-version.txt"
          printf '%s\n' 'sourmash 4.9.4' | cmp - "$RUNNER_TEMP/evidence/sourmash-version.txt"
      - name: Bind the current source and exact Git foundation
        run: python -B scripts/delivery.py source 2>&1 | tee "$RUNNER_TEMP/evidence/source.log"
      - name: Archive one normal release build before test-feature builds
        run: |
          evidence="$RUNNER_TEMP/evidence/builds/candidate"
          cargo metadata --locked --format-version 1 > "$evidence/metadata.json"
          test "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["target_directory"])' "$evidence/metadata.json")" = "$CARGO_TARGET_DIR"
          cargo build --release --locked --bin rsomics-sketch --message-format=json > "$evidence/build.jsonl" 2> "$evidence/build.stderr"
          excluded_ids=$(jq '[.packages[] | select(.name == "rsomics-sketch") | .id]' "$evidence/metadata.json")
          jq -sS --argjson excluded "$excluded_ids" '[.[] | select(.reason == "compiler-artifact") | select(.package_id as $id | $excluded | index($id) | not) | {package_id, target: {name: .target.name, kind: .target.kind}, features: (.features | sort)}] | sort_by(.package_id,.target.name,.target.kind,.features)' "$evidence/build.jsonl" > "$evidence/compiled-external-features.json"
          cp Cargo.toml Cargo.lock "$evidence/"
          cp "$CARGO_TARGET_DIR/release/rsomics-sketch" "$evidence/rsomics-sketch"
          (cd "$evidence" && shasum -a 256 rsomics-sketch Cargo.lock > SHA256SUMS)
          cargo test --release --locked --all-targets --all-features 2>&1 | tee "$evidence/release-tests.log"
          RSOMICS_SKETCH_BIN="$evidence/rsomics-sketch" cargo test --release --locked --test oracle -- --ignored 2>&1 | tee "$evidence/archived-binary-oracle.log"
          (cd "$evidence" && shasum -a 256 -c SHA256SUMS)
      - name: Acquire the complete pinned fixture
        run: |
          if [[ "$WORKLOAD" == genome ]]; then
            input_name=GCF_000005845.2_ASM584v2_genomic.fna
            url=https://ftp.ncbi.nlm.nih.gov/genomes/all/GCF/000/005/845/GCF_000005845.2_ASM584v2/GCF_000005845.2_ASM584v2_genomic.fna.gz
            curl --fail --location --retry 3 --max-time 300 --dump-header "$RUNNER_TEMP/evidence/input-http-headers.txt" "$url" -o "$RUNNER_TEMP/inputs/$input_name.gz"
            test "$(shasum -a 256 "$RUNNER_TEMP/inputs/$input_name.gz" | awk '{print $1}')" = a96d3cfa58c88d477013c768f90a11d2386d42a70d566abfb6d9013dcbd24255
            gzip -dc "$RUNNER_TEMP/inputs/$input_name.gz" > "$RUNNER_TEMP/inputs/$input_name"
            input_sha=53bb6a51b6e92139ced1e38f74b7938781027c52200922ff03718c2237d23bb4
            input_bytes=4699745
          else
            input_name=SRR341550_1.fastq.gz
            url=https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR341/SRR341550/SRR341550_1.fastq.gz
            curl --fail --location --retry 3 --max-time 900 --dump-header "$RUNNER_TEMP/evidence/input-http-headers.txt" "$url" -o "$RUNNER_TEMP/inputs/$input_name"
            input_sha=d7a15c1762d64a5434ced0cc665d7f5d167ca81a71e239f8237b9cd490dd7683
            input_bytes=87439836
          fi
          test "$(shasum -a 256 "$RUNNER_TEMP/inputs/$input_name" | awk '{print $1}')" = "$input_sha"
          test "$(wc -c < "$RUNNER_TEMP/inputs/$input_name" | tr -d ' ')" = "$input_bytes"
          printf '%s\n' "$url" > "$RUNNER_TEMP/evidence/input-url.txt"
          echo "INPUT_NAME=$input_name" >> "$GITHUB_ENV"
          echo "INPUT_SHA=$input_sha" >> "$GITHUB_ENV"
      - name: Measure only the candidate and sourmash on the full input
        run: |
          options=(--warmups 4 --rounds 16)
          if [[ "$WORKLOAD" == fastq-abundance ]]; then options=(--warmups 1 --rounds 8 --abundance); fi
          python -B .github/benchmarks/measure.py --profile product \
            --input "$RUNNER_TEMP/inputs/$INPUT_NAME" --sha256 "$INPUT_SHA" \
            --output-dir "$RUNNER_TEMP/evidence/trials" \
            --candidate "$RUNNER_TEMP/evidence/builds/candidate/rsomics-sketch" \
            --sourmash "$SOURMASH" "${options[@]}" 2>&1 | tee "$RUNNER_TEMP/evidence/measurement.log"
          (cd "$RUNNER_TEMP/evidence/builds/candidate" && shasum -a 256 -c SHA256SUMS)
      - name: Verify the ARM oracle runtime bytes after measurements
        if: ${{ always() && matrix.native.host == 'aarch64-unknown-linux-gnu' && env.SOURMASH != '' }}
        run: |
          "$SOURMASH" --record-runtime "$RUNNER_TEMP/evidence/sourmash-runtime-after.json"
          cmp "$RUNNER_TEMP/evidence/sourmash-runtime-before.json" "$RUNNER_TEMP/evidence/sourmash-runtime-after.json"
      - name: Retain all paired distributions and enforce strict process-RSS advantage
        run: |
          python -B - <<'PY'
          import json, os, statistics
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'evidence/trials'
          manifest = json.loads((directory / 'manifest.json').read_bytes())
          complete = json.loads((directory / 'complete.json').read_bytes())
          rows = [json.loads(line) for line in (directory / 'observations.jsonl').read_text().splitlines()]
          measured = [r for r in rows if r['phase'] == 'measurement']
          assert manifest['profile'] == complete['profile'] == 'product'
          assert set(manifest['programs']) == {'candidate', 'sourmash'}
          rounds = 16 if os.environ['WORKLOAD'] == 'genome' else 8
          assert manifest['rounds'] == rounds and complete['measured_trials'] == len(measured) == rounds * 2
          metrics = ('wall_seconds', 'user_seconds', 'system_seconds', 'peak_rss_bytes')
          def distribution(values):
              return dict(n=len(values), mean=statistics.mean(values), median=statistics.median(values),
                          stdev=statistics.stdev(values), minimum=min(values), maximum=max(values))
          pairs = []
          for index in range(rounds):
              pair = {r['tool']: r for r in measured if r['round'] == index}
              assert set(pair) == {'candidate', 'sourmash'}
              candidate, upstream = pair['candidate'], pair['sourmash']
              pairs.append(dict(round=index,
                  candidate={k: candidate[k] for k in metrics}, sourmash={k: upstream[k] for k in metrics},
                  candidate_lower_rss=candidate['peak_rss_bytes'] < upstream['peak_rss_bytes'],
                  candidate_slower_wall=candidate['wall_seconds'] > upstream['wall_seconds'],
                  candidate_to_sourmash_wall_ratio=candidate['wall_seconds'] / upstream['wall_seconds']))
          summaries = {}
          for tool in ('candidate', 'sourmash'):
              selected = [r for r in measured if r['tool'] == tool]
              summaries[tool] = {metric: distribution([r[metric] for r in selected]) for metric in metrics}
              summaries[tool]['input_bytes_per_wall_second'] = distribution(
                  [manifest['input_bytes'] / r['wall_seconds'] for r in selected])
          passed = all(p['candidate_lower_rss'] for p in pairs)
          report = dict(schema='rsomics.sketch.product-measurement.v1', head=os.environ['GITHUB_SHA'],
              native_host=os.environ['EXPECTED_HOST'], workload=os.environ['WORKLOAD'],
              input_sha256=manifest['input_sha256'], input_bytes=manifest['input_bytes'],
              programs=manifest['programs'], ksize=31, scaled=1000, seed=42, abundance=manifest['abundance'],
              warmup_rounds=manifest['warmups'], measured_rounds=rounds, cpu_affinity=manifest['cpu_affinity'],
              distributions=summaries, paired_observations=pairs, candidate_strictly_lower_rss_every_pair=passed,
              scope='This native/workload job only; all eight jobs must pass. Process RSS, not causal or universal speed evidence.')
          text = json.dumps(report, indent=2, sort_keys=True) + '\n'
          (directory / 'paired-summary.json').write_text(text)
          print(text)
          if not passed:
              raise SystemExit('candidate process RSS is not strictly lower in every measured pair')
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: sketch-construction-${{ matrix.native.runner }}-${{ matrix.workload }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/delivery
            ${{ runner.temp }}/source-verification.json
          if-no-files-found: error
          retention-days: 90
